# /etc/nginx/sites-available/funknaht
# funknaht.de durch deine Domain ersetzen. Die HTTPS-Teile ergänzt certbot automatisch.
limit_req_zone $binary_remote_addr zone=funknaht_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name funknaht.de www.funknaht.de;

    # Uploads bis 5 MB plus etwas Luft
    client_max_body_size 8m;

    # Keine IP-Adressen im Zugriffsprotokoll speichern (Datenschutz)
    access_log off;

    # Nur eine Adresse verwenden (wichtig für Anmeldung und Formulare)
    if ($host = www.funknaht.de) { return 301 https://funknaht.de$request_uri; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        limit_req zone=funknaht_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/funknaht-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/funknaht-proxy.conf;
    }
}
